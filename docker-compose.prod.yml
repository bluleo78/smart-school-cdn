# 로컬 통합/홈 네트워크 테스트용 Docker Compose (이미지 빌드 포함)
# 표준 포트 사용 — LAN 상의 iPad·폰에서 직접 DNS/HTTP/HTTPS 접근 가능:
#   proxy      → 80 (HTTP), 443 (HTTPS)
#   dns-service → 53/udp
#   admin-web  → 7778 (관리 UI는 포트 지정 가능하므로 비표준 유지)
# 주의: 같은 호스트에 별도 prod 스택이 돌고 있으면 443·53 충돌 → prod 먼저 중단 필요
# CDN_IP 환경변수로 iPad가 받을 A 레코드값 지정:
#   CDN_IP=192.168.0.2 pnpm docker:up    # Mac의 LAN IP
# 사용법: pnpm docker:build && CDN_IP=<Mac-LAN-IP> pnpm docker:up
name: smart-school-cdn-local

services:
  # Phase 7 Optimizer Service — 이미지/텍스트 최적화 gRPC 엔드포인트(:50054)
  # deploy/docker-compose.yml 과 대칭을 맞춰 로컬 통합 테스트에서도 최적화 경로가 동작하도록 추가
  optimizer-service:
    build:
      context: .
      dockerfile: services/optimizer-service/Dockerfile
    restart: unless-stopped
    volumes:
      - optimizer_data:/app/data
    environment:
      - OPTIMIZER_DB_PATH=/app/data/optimizer.db
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cdn-local

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    restart: unless-stopped
    volumes:
      - cache_data:/app/cache
    environment:
      - CACHE_DIR=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-5}
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cdn-local

  tls-service:
    build:
      context: .
      dockerfile: services/tls-service/Dockerfile
    restart: unless-stopped
    volumes:
      - certs_data:/app/certs
    environment:
      - CERTS_DIR=/app/certs
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cdn-local

  dns-service:
    build:
      context: .
      dockerfile: services/dns-service/Dockerfile
    restart: unless-stopped
    ports:
      - "53:53/udp"    # DNS 쿼리 (홈 네트워크 iPad/폰 직접 접근용)
    environment:
      - CDN_IP=${CDN_IP:-127.0.0.1}
      - DNS_UPSTREAM=${DNS_UPSTREAM:-8.8.8.8}
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cdn-local

  proxy:
    build:
      context: .
      dockerfile: services/proxy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:8080"     # HTTP 프록시 (홈 네트워크 iPad/폰 직접 접근용)
      - "443:443"     # HTTPS 프록시 (홈 네트워크 iPad/폰 직접 접근용)
    environment:
      - STORAGE_GRPC_URL=http://storage-service:50051
      - TLS_GRPC_URL=http://tls-service:50052
      - OPTIMIZER_GRPC_URL=http://optimizer-service:50054
      - RUST_LOG=info
      # Phase 15 — 텍스트 압축 (비활성화 시 false 또는 0)
      - TEXT_COMPRESS_ENABLED=true
      - TEXT_COMPRESS_MIN_BYTES=1024
      - TEXT_COMPRESS_BR_LEVEL=11
      - TEXT_COMPRESS_GZIP_LEVEL=6
      - TEXT_COMPRESS_MAX_BYTES=8388608
      # Phase 21 — admin-server /internal/* 호출 시 X-Internal-Token 헤더로 사용
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      # 이슈 #391 — 동시 origin fetch 한도 (Semaphore). 한도 초과 시 503 Retry-After.
      - PROXY_MAX_CONCURRENT_ORIGIN_FETCH=64
      # 이슈 #390 — coalescer broadcast 채널 capacity. 학교 규모에 맞춰 조정 (큰 학교 2048 권장).
      - PROXY_COALESCE_CHANNEL_CAPACITY=1024
    # 이슈 #391 — proxy 컨테이너 메모리 한도. 대용량 in-flight 버퍼 폭주 시 컨테이너 자체가 격리되어
    # docker OOM-kill → restart unless-stopped 으로 자가 복구. host 영향 차단.
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      optimizer-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      tls-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cdn-local

  admin-server:
    build:
      context: .
      dockerfile: services/admin-server/Dockerfile
    restart: unless-stopped
    volumes:
      - admin_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DB_PATH=/app/data/admin.db
      - PROXY_ADMIN_URL=http://proxy:8081
      - PROXY_HTTP_URL=http://proxy:8080
      - PROXY_HTTPS_URL=https://proxy:443
      - STORAGE_GRPC_URL=http://storage-service:50051
      - TLS_GRPC_URL=http://tls-service:50052
      - DNS_GRPC_URL=http://dns-service:50053
      - OPTIMIZER_GRPC_URL=http://optimizer-service:50054
      # Phase 21 — 인증 (운영 .env 에서 주입; 미설정 시 admin-server 기동 거부)
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      proxy:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      tls-service:
        condition: service_healthy
      dns-service:
        condition: service_healthy
      optimizer-service:
        condition: service_healthy
    # 이슈 #369 — readiness 엔드포인트 — SQLite + critical 서비스(proxy/storage/tls/dns) 가용성 검증.
    # 503 응답 시 docker compose 가 unhealthy 마킹 → admin-web depends_on 이 영향 받아 트래픽 우회.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4001/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cdn-local

  admin-web:
    build:
      context: .
      dockerfile: services/admin-web/Dockerfile
    restart: unless-stopped
    ports:
      - "7778:80"   # Admin UI (로컬 테스트 전용)
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-server
    networks:
      - cdn-local

volumes:
  cache_data:
  certs_data:
  admin_data:
  optimizer_data:

networks:
  cdn-local:
    driver: bridge
